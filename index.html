<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>MSH Invoice Engine</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#F8F6F1; --panel:#FFFFFF; --ink:#1B2430; --muted:#5C6673; --line:#DCD6CA;
  --blue:#154A89; --peacock:#11596D; --orange:#E5833B; --mustard:#BFA165;
  --field:#FFFFFF; --soft:#EEF2F7; --danger:#B3261E; --ok:#11596D;
  --sans:'Poppins',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161C; --panel:#1A2029; --ink:#E9ECF1; --muted:#9AA4B2; --line:#2E3744;
    --field:#141A22; --soft:#1F2833; --blue:#6E9FD8; --peacock:#5FB3C6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161C; --panel:#1A2029; --ink:#E9ECF1; --muted:#9AA4B2; --line:#2E3744;
  --field:#141A22; --soft:#1F2833; --blue:#6E9FD8; --peacock:#5FB3C6; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:minmax(340px,460px) 1fr;gap:28px;max-width:1500px;margin:0 auto;padding:28px 24px 60px}
@media (max-width:980px){.app{grid-template-columns:1fr;padding:18px 14px 50px}}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px}
header.top img{height:44px;width:auto}
:root[data-theme="dark"] header.top img{filter:brightness(0) invert(1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header.top img{filter:brightness(0) invert(1)}}
header.top h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:0;line-height:1.1}
header.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.form{display:flex;flex-direction:column;gap:18px}
section.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 16px 14px}
section.box h2{font-family:var(--serif);font-size:17px;font-weight:600;margin:0 0 10px;color:var(--blue)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--field);color:var(--ink);padding:9px 6px;font:500 13px var(--sans);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0E1620}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0E1620}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.f.full{grid-column:1/-1}
input,select,textarea{font:400 14px var(--sans);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:58px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--peacock);outline-offset:1px}
input[aria-invalid="true"]{border-color:var(--danger)}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.hint strong{color:var(--ink);font-weight:600}
.err{font-size:12px;color:var(--danger);margin:4px 0 0}
.line{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:var(--soft)}
.line .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--muted);font-weight:500}
.line .calc{font-size:12px;color:var(--muted);margin-top:8px}
.line .calc b{color:var(--ink);font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600;background:var(--peacock);color:#fff}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font:500 12px var(--sans);padding:2px 4px}
.x:hover{color:var(--danger)}
.add{border:1px dashed var(--line);background:none;color:var(--blue);border-radius:8px;padding:8px;width:100%;font:500 13px var(--sans);cursor:pointer}
.numrow{display:flex;gap:8px;align-items:flex-end}
.numrow label{flex:1}
.link{border:0;background:none;color:var(--blue);font:500 12px var(--sans);cursor:pointer;padding:0;text-decoration:underline}
.actions{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 0 calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;flex-wrap:wrap}
.primary{flex:1;border:0;background:var(--orange);color:#1B1206;border-radius:9px;padding:12px 16px;font:600 15px var(--sans);cursor:pointer}
.primary:disabled{opacity:.6;cursor:progress}
.secondary{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:12px 16px;font:500 14px var(--sans);cursor:pointer}
.msg{width:100%;font-size:13px;margin:0}
.msg.bad{color:var(--danger)} .msg.good{color:var(--ok)}
.previewWrap{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));align-self:start}
@media (max-width:980px){.previewWrap{position:static}}
.previewWrap .cap{font-size:12px;color:var(--muted);margin:0 0 8px}
.stage{width:100%;overflow:hidden}
.scaler{transform-origin:top left}

/* ---------- The invoice paper (always light) ---------- */
.paper{width:794px;min-height:1123px;background:#fff;color:#16202C;font-family:'Poppins',Arial,sans-serif;font-size:10.5px;line-height:1.45;padding:40px 38px;box-shadow:0 1px 3px rgba(20,30,50,.12),0 8px 30px rgba(20,30,50,.08)}
.paper.capture{box-shadow:none}
.inv{border:1.2px solid #154A89}
.inv .title{text-align:center;padding:10px 0 6px;font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:600;color:#154A89;letter-spacing:.2px}
.inv .entity{background:#154A89;color:#fff;text-align:center;font-weight:600;font-size:15px;padding:6px 0;letter-spacing:.6px}
.inv .eaddr{text-align:center;padding:8px 20px 9px;font-size:10px;border-bottom:1.2px solid #154A89}
.inv .eaddr div{margin:1px 0}
.inv .eaddr b{font-weight:600}
.meta{display:grid;grid-template-columns:1fr 210px;border-bottom:1.2px solid #154A89}
.meta table{width:100%;border-collapse:collapse}
.meta td{padding:8px 10px;border-bottom:1px solid #D7DFEA}
.meta tr:last-child td{border-bottom:0}
.meta td:last-child{text-align:right;font-weight:600}
.meta .logo{border-left:1.2px solid #154A89;display:flex;align-items:center;justify-content:center;padding:8px}
.meta .logo img{max-height:84px;width:auto}
.cust{padding:10px 10px 12px;border-bottom:1.2px solid #154A89}
.cust .lbl{font-family:'Playfair Display',Georgia,serif;font-weight:600;color:#11596D;font-size:12px;margin-bottom:3px}
.cust div{margin:1px 0}
.cust span{color:#5C6673;display:inline-block;min-width:88px}
table.items{width:100%;border-collapse:collapse}
table.items th{background:#154A89;color:#fff;font-weight:500;font-size:9.5px;padding:6px 5px;text-align:center;border-left:1px solid #2F63A3}
table.items th:first-child{border-left:0}
table.items tr.sub th{background:#E4EBF4;color:#154A89;font-weight:600;border-left:1px solid #C9D5E5}
table.items td{padding:7px 6px;border-bottom:1px solid #D7DFEA;border-left:1px solid #D7DFEA;text-align:right;vertical-align:middle}
table.items td:first-child{border-left:0;text-align:center}
table.items td.desc{text-align:left}
table.items td.c{text-align:center}
table.items tr.tot td{background:#154A89;color:#fff;font-weight:600;border-left-color:#2F63A3;border-bottom:0}
table.items tr.ro td{color:#5C6673;font-size:10px}
.sum{display:grid;grid-template-columns:1fr 1fr;border-top:1.2px solid #154A89}
.sum > div{padding:8px 10px;border-bottom:1px solid #D7DFEA}
.sum .k{font-weight:600;text-align:center;border-right:1px solid #D7DFEA}
.sum .v{text-align:center;font-weight:700;font-size:12px}
.sum .w{text-align:center;font-weight:600;font-size:10.5px}
.foot{display:grid;grid-template-columns:1fr 1fr;border-top:1.2px solid #154A89}
.foot .bank{padding:9px 10px;border-right:1.2px solid #154A89}
.foot .bank b{display:block;font-family:'Playfair Display',Georgia,serif;color:#11596D;font-size:12px;margin-bottom:2px}
.foot .bank div{margin:1px 0}
.foot .sign{display:flex;flex-direction:column;justify-content:space-between;text-align:center;padding:9px 10px 7px;min-height:122px}
.foot .sign .for{font-weight:600;font-size:10px}
.foot .sign .by{font-weight:600;border-top:1px solid #D7DFEA;padding-top:5px}
.cnref{padding:8px 10px;border-bottom:1.2px solid #154A89;background:#FBF8F1}
.cnref span{color:#5C6673;display:inline-block;min-width:150px}
.top .docsBtn{margin-left:auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 14px;font:500 13px var(--sans);cursor:pointer;display:flex;gap:8px;align-items:center}
.top .docsBtn .count{background:var(--peacock);color:#fff;border-radius:20px;padding:0 8px;font-size:11px;font-weight:600}
.banner{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--peacock);border-radius:10px;padding:12px 14px}
.banner h2{font-family:var(--serif);font-size:18px;margin:0 0 2px;color:var(--peacock)}
.banner p{margin:0;color:var(--muted);font-size:13px}
.banner.locked{border-left-color:var(--blue)}
.banner.locked h2{color:var(--blue)}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.acc-row{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);margin-bottom:8px}
.acc-row.on{border-color:var(--peacock);box-shadow:inset 3px 0 0 var(--peacock)}
.acc-row label.ck{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:500;cursor:pointer}
.acc-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--peacock);flex:none}
.acc-row input[type=number]{padding:6px 8px}
.acc-row.full{background:var(--soft)}
.acc-row.dis{opacity:.45}
.mini{font-size:11px;color:var(--muted);display:block;font-weight:400}
.secondary:disabled{opacity:.5;cursor:not-allowed}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer header h2{font-family:var(--serif);font-size:20px;margin:0;color:var(--blue)}
.drawer header .x{margin-left:auto;font-size:14px}
.drawer .tools{padding:12px 18px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.drawer .body{overflow:auto;padding:14px 18px 30px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:20px;padding:5px 12px;font:500 12px var(--sans);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.card .row1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card .no{font-weight:600}
.card .amt{font-weight:600;white-space:nowrap}
.card .sub{font-size:12px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 8px;border-radius:20px;margin-right:6px;vertical-align:1px}
.tag.pi{background:#FBF1DF;color:#8A5A12}.tag.inv{background:#E3ECF7;color:#154A89}.tag.cn{background:#F7E4E2;color:#9A2B22}.tag.fin{background:#DDF0EE;color:#11596D}
.vers{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.vers button,.card .acts button{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:7px;padding:4px 10px;font:500 12px var(--sans);cursor:pointer}
.card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:13px}
.sheetwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
table.sheet{border-collapse:collapse;font-size:11.5px;color:#1B2430;min-width:1700px}
table.sheet th{background:#154A89;color:#fff;font-weight:500;padding:6px 8px;text-align:left;white-space:nowrap;position:sticky;top:0}
table.sheet td{padding:5px 8px;border-bottom:1px solid #E1E6EE;border-right:1px solid #EEF1F5;white-space:nowrap}
table.sheet td.n{text-align:right}
table.sheet td.w{white-space:normal;min-width:220px}
.sheettabs{display:flex;gap:0;margin-top:8px}
.sheettabs button{border:1px solid var(--line);border-top:0;background:var(--soft);color:var(--ink);padding:5px 14px;font:500 12px var(--sans);cursor:pointer}
.sheettabs button[aria-pressed="true"]{background:#fff;color:#154A89;font-weight:600}
:root[data-theme="dark"] .sheettabs button[aria-pressed="true"]{background:var(--panel);color:var(--blue)}
.inv .pinote{padding:7px 10px;border-top:1px solid #D7DFEA;font-size:9.5px;color:#5C6673;text-align:center;background:#FBF8F1}
.modal{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 32px));background:var(--panel);color:var(--ink);border-radius:12px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-family:var(--serif);font-size:20px;margin:0 0 8px;color:var(--blue)}
.modal p{margin:0 0 16px;color:var(--muted)}
.modal p strong{color:var(--ink)}
.mbtns{display:flex;gap:10px;justify-content:flex-end}
.mbtns .primary{flex:none}
.drawer .seg button{font-size:12px}
.gate{grid-column:1/-1;max-width:420px;margin:30px auto 0;width:100%}
.tabs{margin-bottom:0}
.saved{background:var(--panel);border:1px solid var(--peacock);border-left:5px solid var(--peacock);border-radius:10px;padding:16px}
.saved h2{font-family:var(--serif);font-size:19px;margin:0 0 4px;color:var(--peacock)}
.saved p{margin:0 0 12px;color:var(--muted);font-size:13px}
.saved .btns{display:flex;flex-direction:column;gap:8px}
.who{margin-left:auto;text-align:right;font-size:12px;color:var(--muted)}
.who button{margin-top:2px}
@media (max-width:600px){header.top{flex-wrap:wrap}.who{margin-left:0;text-align:left}}

.btns a.secondary{display:block}
.drawer a{color:var(--blue)}
</style>
</head>

<div class="app" id="app"></div>
<div id="drawerHost"></div>
<div id="modalHost"></div>

function accDesc(d){
  const p = PROPS[d.prop], n = num(d.acc.nights), pax = num(d.acc.pax);
  const tail = `${pax ? pax + " Pax " : ""}for ${n} Night${n === 1 ? "" : "s"}`;
  if (d.acc.full) return `Full Campsite (${p.loc}) – ${FULL_UNITS[d.prop]} units, ${tail}`;
  const parts = ticked(d).map(t => { const q = num(d.acc.sel[t]); return isDorm(t) ? `${q} Bed${q === 1 ? "" : "s"} in Colony dorm` : `${q} ${t}`; });
  return `${joinList(parts) || "Accommodation"} (${p.loc}) ${tail}`;
}
function build(desc, sac, taxable, rate, igst){
  taxable = r2(taxable);
  if (igst){ const t = r2(taxable*rate/100); return { desc, sac, taxable, rate, igst: t, cgst: 0, sgst: 0, total: r2(taxable+t) }; }
  const h = r2(taxable*rate/200); return { desc, sac, taxable, rate, igst: 0, cgst: h, sgst: h, total: r2(taxable+h*2) };
}
function linesOf(d, kind){
  const ig = d.taxType === "IGST", out = [];
  if (num(d.acc.amount)) out.push(build(accDesc(d), SAC.ROOM, num(d.acc.amount), accRate(d, kind), ig));
  d.addons.forEach(a => {
    if (!num(a.amount) && !a.desc.trim()) return;
    out.push(build(a.desc.trim() || "Add-on", a.sac === "other" ? a.sacOther.trim() : a.sac, num(a.amount), Number(a.rate), ig));
  });
  return out;
}
function totalsOf(ls){
  const t = ls.reduce((a,l) => ({ taxable: a.taxable+l.taxable, cgst: a.cgst+l.cgst, sgst: a.sgst+l.sgst, igst: a.igst+l.igst, total: a.total+l.total }), { taxable:0,cgst:0,sgst:0,igst:0,total:0 });
  Object.keys(t).forEach(k => t[k] = r2(t[k]));
  t.rounded = Math.round(t.total); t.roundOff = r2(t.rounded - t.total);
  return t;
}
const ONES = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
const TENS = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
const two = n => n < 20 ? ONES[n] : TENS[Math.floor(n/10)] + (n%10 ? " " + ONES[n%10] : "");
const three = n => (n >= 100 ? ONES[Math.floor(n/100)] + " Hundred" + (n%100 ? " " : "") : "") + (n%100 ? two(n%100) : "");
function words(n){
  n = Math.round(Math.abs(n)); if (!n) return "Zero";
  const p = [], cr = Math.floor(n/1e7), lk = Math.floor(n/1e5)%100, th = Math.floor(n/1e3)%100, rest = n%1000;
  if (cr) p.push(words(cr) + " Crore"); if (lk) p.push(two(lk) + " Lakh"); if (th) p.push(two(th) + " Thousand"); if (rest) p.push(three(rest));
  return p.join(" ");
}
const inWords = n => "Rupees " + words(n) + " Only";

function taxNoteHTML(){
  const g = gstinOf(S);
  if (S.taxType === "IGST") return "<strong>IGST</strong> is applied on every line.";
  if (g.length >= 2 && g.slice(0,2) !== "27") return `<strong>CGST + SGST</strong> is applied. This GSTIN starts with ${esc(g.slice(0,2))} (outside Maharashtra), but stays at our properties are still billed CGST + SGST. Switch to IGST only if your CA advises it.`;
  return "<strong>CGST + SGST</strong> is applied on every line.";
}

/* ---------- confirm dialog ---------- */
function ask(title, body, okLabel){
  return new Promise(resolve => {
    const host = document.getElementById("modalHost");
    host.innerHTML = `<div class="scrim" style="z-index:60"></div>
      <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="mTitle">
        <h2 id="mTitle">${esc(title)}</h2><p>${body}</p>
        <div class="mbtns"><button class="secondary" type="button" id="mNo">Cancel</button><button class="primary" type="button" id="mYes">${esc(okLabel)}</button></div>
      </div>`;
    const done = v => { host.innerHTML = ""; document.removeEventListener("keydown", onKey); resolve(v); };
    const onKey = e => { if (e.key === "Escape") done(false); };
    document.addEventListener("keydown", onKey);
    document.getElementById("mNo").onclick = () => done(false);
    document.getElementById("mYes").onclick = () => done(true);
    document.getElementById("mYes").focus();
  });
}

function fitPreview(){

  if (!stage) return;

/* ---------- validation, saving ---------- */
function validate(){
  const errs = [], d = S;
  if (!d.cust.name.trim()) errs.push("customer name");
  if (!d.cust.address.trim()) errs.push("billing address");
  const g = gstinOf(d); if (g && !GSTIN_RE.test(g)) errs.push("a valid GSTIN (or leave it blank)");
  if (!d.docDate) errs.push("the document date");
  if (!d.bookingDate) errs.push("date of booking");
  if (!d.acc.full && !ticked(d).length) errs.push("at least one ticked room type or Full campsite");
  if (!d.acc.full && ticked(d).some(t => num(d.acc.sel[t]) < 1)) errs.push("how many of each ticked room type");
  if (num(d.acc.amount) <= 0) errs.push("the total accommodation amount");
  if (num(d.acc.nights) < 1) errs.push("nights of 1 or more");
  if (d.addons.some(a => num(a.amount) > 0 && !a.desc.trim())) errs.push("a description for each add-on");
  if (MODE === "CN" && !d.cn.origNo.trim()) errs.push("the original invoice number");
  if (MODE === "CN" && !d.cn.origDate) errs.push("the original invoice date");
  return errs;
}

async function api(action, data){
  if (!CFG.scriptUrl || /PASTE_YOUR/.test(CFG.scriptUrl)) throw new Error("The Google Sheet link isn't set yet. Add the Web app URL to config.js.");
  let res;
  try {
    res = await fetch(CFG.scriptUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ action, key: KEY, by: USER }, data || {})) });
  } catch(e){ throw new Error("Couldn't reach the Google Sheet. Check your internet connection."); }
  let j; try { j = await res.json(); } catch(e){ throw new Error("The Google Sheet sent back an unexpected reply. Check the Apps Script deployment."); }
  if (!j.ok) throw new Error(j.error || "Something went wrong.");
  return j;
}
async function loadNext(fy){
  try { const j = await api("next", { fy }); NEXT[fy] = j.next; const np = document.getElementById("numPeek"); if (np && !EDITING) np.textContent = peekNo(MODE, S.prop, S.docDate); renderPaper(); }
  catch(e){ say(e.message, "bad"); }
}
function ensureNext(){ const fy = fyOf(S.docDate); if (!NEXT[fy]) loadNext(fy); }

/* ---------- top-level render ---------- */
function render(){
  const app = document.getElementById("app");
  if (!KEY || !USER){ app.innerHTML = gateHTML(); document.getElementById("drawerHost").innerHTML = ""; return; }
  app.innerHTML = `
    <header class="top">
      <img src="${LOGO}" alt="Moonstone Hammock">
      <div><h1>Invoice engine</h1><p>Proformas, tax invoices and credit notes for corporate bookings</p></div>
      <button class="docsBtn" type="button" id="openDocs">Documents</button>
      <div class="who">${esc(USER)}<br><button class="link" type="button" data-signout>Sign out</button></div>
    </header>
    <div class="form" id="form"></div>
    <div class="previewWrap">
      <p class="cap" id="previewCap">Live preview</p>
      <div class="stage" id="stage"><div class="scaler" id="scaler"><div class="paper" id="paper"></div></div></div>
    </div>`;
  new ResizeObserver(fitPreview).observe(document.getElementById("stage"));
  renderForm(); renderDrawer();
}
function gateHTML(){
  return `<div class="gate"><section class="box">
    <div style="text-align:center;margin-bottom:8px"><img src="${LOGO}" alt="Moonstone Hammock" style="height:70px"></div>
    <h2 style="text-align:center">Invoice engine</h2>
    <label class="f">Your name<input id="gName" value="${esc(USER)}" autocomplete="name"></label>
    <label class="f" style="margin-top:10px">Access code<input id="gKey" type="password" autocomplete="current-password"></label>
    <div class="actions" style="position:static;border:0;padding-top:14px"><button class="primary" type="button" data-signin>Sign in</button>
    <p class="msg" id="msg" role="status"></p></div>
    <p class="hint">Ask the accounts lead for the access code. Your name is saved on everything you create.</p>
  </section></div>`;
}

function renderForm(){
  const f = document.getElementById("form"); if (!f) return;
  if (VIEW){ f.innerHTML = viewHTML(); renderPaper(); return; }
  const head = EDITING
    ? `<section class="banner"><h2>${esc(EDITING.number)} · v${EDITING.v}</h2><p>${esc(PROPS[EDITING.prop].label)}. Every save adds a new version; earlier versions stay in the documents panel.</p></section>`
    : `<div class="seg" role="group" aria-label="New document">
        <button type="button" data-mode="PI" aria-pressed="${MODE==="PI"}">New proforma invoice</button>
        <button type="button" data-mode="CN" aria-pressed="${MODE==="CN"}">New credit note</button></div>`;
  let actions;
  if (MODE === "CN") actions = `<button class="primary" type="button" data-issue-cn ${BUSY?"disabled":""}>Issue credit note</button>
      <button class="secondary" type="button" data-clear>Clear</button>`;
  else if (!EDITING) actions = `<button class="primary" type="button" data-save-pi ${BUSY?"disabled":""}>Save proforma (v1)</button>
      <button class="secondary" type="button" data-clear>Clear</button>`;
  else actions = `<button class="primary" type="button" data-save-pi id="saveBtn" ${dirty() && !BUSY ? "" : "disabled"}>${dirty() ? `Save changes as v${EDITING.v + 1}` : "No changes to save"}</button>
      <button class="secondary" type="button" data-dl-current>Download v${EDITING.v} PDF</button>
      <button class="secondary" type="button" data-finalise ${BUSY?"disabled":""}>Generate final tax invoice</button>
      <button class="secondary" type="button" data-close>Close</button>`;
  f.innerHTML = head + editorHTML() + `<div class="actions">${actions}<p class="msg" id="msg" role="status"></p></div>`;
  updateLive();
}

function viewHTML(){
  const V = VIEW, d = V.rec.data, place = PROPS[V.prop].label;
  if (V.kind === "PI"){
    return `<section class="banner ${V.finalNo ? "locked" : ""}">
      <h2>${esc(V.number)} · v${V.v}</h2>
      <p>${esc(place)} · ${esc(d.cust.name)} · saved ${esc(V.rec.savedAt)}${V.rec.by ? " by " + esc(V.rec.by) : ""}.
      ${V.finalNo ? ` Converted to tax invoice <strong>${esc(V.finalNo)}</strong>, so it can't be edited any more.` : V.v !== V.latestV ? ` This is an older version; the latest is v${V.latestV}.` : ""}</p>
      <div class="btns">
        <button class="primary" type="button" data-dl-current>Download v${V.v} PDF</button>
        ${V.finalNo ? `<button class="secondary" type="button" data-open-final>Open tax invoice ${esc(V.finalNo)}</button>` : `<button class="secondary" type="button" data-edit-pi ${BUSY?"disabled":""}>Edit (makes v${V.latestV + 1} when saved)</button>`}
        <button class="secondary" type="button" data-close>Close</button>
      </div><p class="msg" id="msg" role="status" style="margin-top:10px"></p></section>`;
  }
  const cn = V.kind === "CN";
  return `<section class="banner locked">
    <h2>${cn ? "Credit note" : "Tax invoice"} ${esc(V.number)}</h2>
    <p>${esc(place)} · ${esc(d.cust.name)} · issued ${esc(V.rec.issuedAt)}${V.rec.by ? " by " + esc(V.rec.by) : ""}${V.rec.fromPI ? ` from ${esc(V.rec.fromPI)}` : ""}${V.rec.against ? ` against ${esc(V.rec.against)}` : ""}. Final, so it can't be changed${cn ? "" : ". To correct it, raise a credit note"}.</p>
    <p style="margin-top:6px">${V.rec.drive ? `📁 Saved in Google Drive › ${esc(DRIVE_PATH(V))}` : "📁 Not saved to Google Drive yet."}</p>
    <div class="btns">
      <button class="primary" type="button" data-dl-current>Download PDF</button>
      ${V.rec.drive ? `<a class="secondary" style="text-align:center;text-decoration:none" href="${esc(V.rec.drive)}" target="_blank" rel="noopener">Open in Google Drive</a>` : `<button class="secondary" type="button" data-upload ${BUSY?"disabled":""}>Save PDF to Google Drive</button>`}
      ${cn ? "" : `<button class="secondary" type="button" data-make-cn>Raise a credit note against this invoice</button>`}
      <button class="secondary" type="button" data-close>Close</button>
    </div><p class="msg" id="msg" role="status" style="margin-top:10px"></p></section>`;
}
const DRIVE_PATH = V => `MSH Tax Invoices › ${PROPS[V.prop].label}${V.kind === "CN" ? " › Credit notes" : ""}`;

/* ---------- documents panel ---------- */
function renderDrawer(){
  const host = document.getElementById("drawerHost");
  if (!DRAWER.open){ host.innerHTML = ""; return; }
  const P = PANEL[DRAWER.prop];
  const lists = P ? { PI: P.proformas, INV: P.invoices, CN: P.creditNotes } : null;
  const label = { PI: "Proforma invoices", INV: "Tax invoices", CN: "Credit notes" };
  let body;
  if (!P) body = `<div class="empty">Loading ${PROPS[DRAWER.prop].label}…</div>`;
  else if (P.error) body = `<div class="empty" style="color:var(--danger)">${esc(P.error)}</div>`;
  else {
    const items = lists[DRAWER.type];
    body = items.length ? items.map(x => cardHTML(x, DRAWER.type)).join("") : `<div class="empty">No ${label[DRAWER.type].toLowerCase()} for ${PROPS[DRAWER.prop].label} yet.</div>`;
  }
  host.innerHTML = `
  <div class="scrim" data-close-drawer></div>
  <aside class="drawer" role="dialog" aria-label="Documents">
    <header><h2>Documents</h2><button class="x" type="button" data-close-drawer>Close ✕</button></header>
    <div class="tools">
      <div class="chips">${Object.keys(PROPS).map(k => `<button class="chip" type="button" data-dprop="${k}" aria-pressed="${DRAWER.prop===k}">${PROPS[k].label}</button>`).join("")}
        <button class="chip" type="button" data-refresh style="margin-left:auto">↻ Refresh</button></div>
      <div class="seg" role="group" aria-label="Document type">
        ${["PI","INV","CN"].map(k => `<button type="button" data-dtype="${k}" aria-pressed="${DRAWER.type===k}">${label[k]}${lists ? ` (${lists[k].length})` : ""}</button>`).join("")}</div>
      ${P && !P.error ? `<div style="display:flex;gap:14px;font-size:12px"><a href="${esc(P.sheetUrl)}" target="_blank" rel="noopener">Open the Google Sheet</a><a href="${esc(P.driveUrl)}" target="_blank" rel="noopener">Open ${PROPS[DRAWER.prop].label} Drive folder</a></div>` : ""}
    </div>
    <div class="body">${body}</div>
  </aside>`;
}
function cardHTML(x, type){
  const amt = x.total ? `₹${esc(x.total)}` : "";
  if (type === "PI"){
    const l = x.versions[x.versions.length - 1];
    return `<div class="card">
      <div class="row1"><div><span class="tag pi">Proforma</span>${x.finalNo ? `<span class="tag fin">Final · ${esc(x.finalNo)}</span>` : ""}<span class="no">${esc(x.number)}</span></div><span class="amt">${amt}</span></div>
      <div class="sub">${esc(x.cust)} · v${l.v} saved ${esc(l.savedAt)}${l.by ? " by " + esc(l.by) : ""}</div>
      <div class="vers">${x.versions.map(vv => `<button type="button" data-open="PI" data-no="${esc(x.number)}" data-v="${vv.v}">Open v${vv.v}</button>`).join("")}</div>
    </div>`;
  }
  return `<div class="card">
    <div class="row1"><div><span class="tag ${type === "CN" ? "cn" : "inv"}">${type === "CN" ? "Credit note" : "Tax invoice"}</span><span class="no">${esc(x.number)}</span></div><span class="amt">${amt}</span></div>
    <div class="sub">${esc(x.cust)} · ${esc(x.issuedAt)}${x.link ? " · " + esc(x.link) : ""}</div>
    <div class="acts"><button type="button" data-open="${type}" data-no="${esc(x.number)}">Open</button>${x.drive ? `<a href="${esc(x.drive)}" target="_blank" rel="noopener" style="font-size:12px;align-self:center">Open in Drive</a>` : `<span class="sub" style="align-self:center">Not in Drive yet</span>`}</div>
  </div>`;
}
async function loadPanel(prop, force){
  if (PANEL[prop] && !PANEL[prop].error && !force) return;
  PANEL[prop] = null; renderDrawer();
  try { PANEL[prop] = await api("list", { prop }); } catch(e){ PANEL[prop] = { error: e.message }; }
  if (DRAWER.prop === prop) renderDrawer();
}

/* ---------- actions ---------- */
async function savePI(){
  const errs = validate(); if (errs.length){ say("Add " + errs.join(", ") + ".", "bad"); return; }
  if (EDITING && !dirty()){ say("Nothing has changed since the last version.", ""); return; }
  const data = cleanData();
  BUSY = true; renderForm(); say("Saving to the Google Sheet…");
  try {
    const r = await api("savePI", { data, summary: summaryOf(data, "PI"), number: EDITING ? EDITING.number : "", expectedV: EDITING ? EDITING.v : 0 });
    NEXT[fyOf(data.docDate)] = r.next; delete PANEL[data.prop];
    EDITING = { number: r.number, prop: data.prop, v: r.v, base: JSON.stringify(data) }; S = clone(data);
    BUSY = false; renderForm(); say(`Saved ${r.number} v${r.v}.`, "good");
  } catch(e){ BUSY = false; renderForm(); say(e.message, "bad"); }
}
async function finalise(){
  if (dirty()){ say(`You have unsaved changes. Save them as v${EDITING.v + 1} first, so the tax invoice matches a saved version.`, "bad"); return; }
  const no = peekNo("INV", EDITING.prop, today());
  if (!await ask("Generate the final tax invoice?", `It's made from <strong>${esc(EDITING.number)} v${EDITING.v}</strong>, dated today and numbered ${esc(no)} (or the next free number). It can't be changed afterwards, the proforma is locked, and the PDF is saved to Google Drive.`, "Generate tax invoice")) return;
  BUSY = true; renderForm(); say("Generating the tax invoice…");
  try {
    const r = await api("finalise", { prop: EDITING.prop, number: EDITING.number, expectedV: EDITING.v });
    NEXT[fyOf(r.record.data.docDate)] = r.next; delete PANEL[EDITING.prop];
    VIEW = { kind: "INV", prop: EDITING.prop, number: r.record.number, rec: r.record };
    EDITING = null; BUSY = false; renderForm();
    await uploadCurrent(`Tax invoice ${r.record.number} generated.`);
  } catch(e){ BUSY = false; renderForm(); say(e.message, "bad"); }
}
async function issueCN(){
  const errs = validate(); if (errs.length){ say("Add " + errs.join(", ") + ".", "bad"); return; }
  if (!await ask("Issue this credit note?", `For <strong>${esc(S.cust.name.trim())}</strong> against ${esc(S.cn.origNo.trim())}. It's final, can't be changed afterwards, and the PDF is saved to Google Drive.`, "Issue credit note")) return;
  const data = cleanData();
  BUSY = true; renderForm(); say("Issuing the credit note…");
  try {
    const r = await api("issueCN", { data, summary: summaryOf(data, "CN") });
    NEXT[fyOf(data.docDate)] = r.next; delete PANEL[data.prop];
    VIEW = { kind: "CN", prop: data.prop, number: r.record.number, rec: r.record };
    MODE = "PI"; S = freshData(data.prop); BUSY = false; renderForm();
    await uploadCurrent(`Credit note ${r.record.number} issued.`);
  } catch(e){ BUSY = false; renderForm(); say(e.message, "bad"); }
}
async function uploadCurrent(prefix){
  const V = VIEW; say(`${prefix ? prefix + " " : ""}Saving the PDF to Google Drive…`, "good");
  BUSY = true;
  try {
    const args = currentPaper(), blob = await makePdf(args);
    const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
    const r = await api("uploadPdf", { kind: V.kind, prop: V.prop, number: V.number, fileName: fileNameOf(args), pdf: b64 });
    V.rec.drive = r.url; delete PANEL[V.prop]; BUSY = false;
    if (VIEW === V){ renderForm(); say(`${prefix ? prefix + " " : ""}PDF saved to Google Drive.`, "good"); }
  } catch(e){
    BUSY = false;
    if (VIEW === V){ renderForm(); say(`${prefix ? prefix + " " : ""}The PDF wasn't saved to Drive (${e.message}). Use “Save PDF to Google Drive” to try again.`, "bad"); }
  }
}
async function openDoc(kind, prop, number, v){
  DRAWER.open = false; renderDrawer();
  if (EDITING && dirty() && !await ask("Leave without saving?", `Your changes haven't been saved as v${EDITING.v + 1}.`, "Leave without saving")) return;
  say("Opening…");
  try {
    const r = await api("get", { kind, prop, number, v });
    VIEW = kind === "PI" ? { kind, prop, number, v: r.record.v, latestV: r.latestV, finalNo: r.finalNo, rec: r.record } : { kind, prop, number, rec: r.record };
    EDITING = null; renderForm();
  } catch(e){ say(e.message, "bad"); }
}
async function editPI(){
  const V = VIEW;
  let rec = V.rec;
  if (V.v !== V.latestV){
    try { rec = (await api("get", { kind: "PI", prop: V.prop, number: V.number })).record; } catch(e){ say(e.message, "bad"); return; }
  }
  S = clone(rec.data); EDITING = { number: V.number, prop: V.prop, v: rec.v, base: JSON.stringify(rec.data) };
  VIEW = null; MODE = "PI"; renderForm();
}
function cnFrom(V){
  const d = clone(V.rec.data); d.docDate = today();
  d.acc.override = String(accRate(V.rec.data, "INV"));
  d.cn = { origNo: V.number, origDate: V.rec.data.docDate, reason: "Booking cancelled", reasonOther: "" };
  return d;
}

/* ---------- PDF ---------- */
async function makePdf(args){
  const holder = document.createElement("div");
  holder.style.cssText = "position:fixed;left:-10000px;top:0;width:794px;background:#fff";
  holder.innerHTML = `<div class="paper capture">${paperHTML(...args)}</div>`;
  document.body.appendChild(holder);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await html2canvas(holder.firstElementChild, { scale: 2, backgroundColor: "#ffffff", logging: false });
    const pdf = new window.jspdf.jsPDF({ unit: "pt", format: "a4", compress: true });
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight(), pagePx = Math.floor(canvas.width * ph / pw);
    let y = 0, first = true;
    while (y < canvas.height){
      const h = Math.min(pagePx, canvas.height - y), c = document.createElement("canvas"); c.width = canvas.width; c.height = h;
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,h); ctx.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
      if (!first) pdf.addPage();
      pdf.addImage(c.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, pw, h * pw / canvas.width);
      first = false; y += pagePx; if (canvas.height - y < 40) break;
    }
    pdf.setProperties({ title: args[2] });
    return pdf.output("blob");
  } finally { holder.remove(); }
}
function fileNameOf([d, kind, number, version]){
  const cust = (d.cust.name.trim() || "Customer").replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ");
  return `${cust} - ${PROPS[d.prop].code} ${String(number).replace(/\//g, "_")}${kind === "PI" ? " v" + version : ""}.pdf`;
}
async function downloadCurrent(){
  const args = currentPaper();
  if (!VIEW && EDITING && dirty()){ say(`Save your changes as v${EDITING.v + 1} first, or this PDF won't match a saved version.`, "bad"); return; }
  say("Making the PDF…");
  try {
    const blob = await makePdf(args), name = fileNameOf(args);
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    say(`Downloaded ${name}.`, "good");
  } catch(e){ say("The PDF couldn't be made. " + (e && e.message ? e.message : ""), "bad"); }
}

/* ---------- events ---------- */
function setPath(path, val){ const ks = path.split("."); let o = S; for (let i=0;i<ks.length-1;i++) o = o[ks[i]]; o[ks[ks.length-1]] = val; }
const appEl = document.getElementById("app");
appEl.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.qty !== undefined){ S.acc.sel[t.dataset.qty] = t.value; updateLive(); return; }
  const k = t.dataset.k; if (!k) return;
  setPath(k, t.value);
  if (t.hasAttribute("data-rerender")) { renderForm(); return; }
  updateLive();
});
appEl.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.room !== undefined){
    if (t.checked) S.acc.sel[t.dataset.room] = "1"; else delete S.acc.sel[t.dataset.room];
    renderForm(); const q = document.querySelector(`[data-qty="${CSS.escape(t.dataset.room)}"]`); if (t.checked && q){ q.focus(); q.select(); }
  } else if (t.hasAttribute("data-full")){ S.acc.full = t.checked; renderForm(); }
  else if (t.dataset.k === "docDate"){ renderForm(); ensureNext(); }
});
appEl.addEventListener("focusout", e => { if (e.target.dataset.k === "cust.gstin") updateLive(); });
appEl.addEventListener("keydown", e => { if (e.key === "Enter" && (e.target.id === "gKey" || e.target.id === "gName")) signIn(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && DRAWER.open){ DRAWER.open = false; renderDrawer(); } });
document.addEventListener("click", e => {
  const b = e.target.closest("button, .scrim"); if (!b || b.closest("#modalHost")) return;
  const d = b.dataset;
  if (b.hasAttribute("data-signin")) signIn();
  else if (b.hasAttribute("data-signout")){ store.del("msh_inv_key"); KEY = ""; render(); }
  else if (b.id === "openDocs"){ DRAWER.open = true; DRAWER.prop = (VIEW && VIEW.prop) || S.prop; renderDrawer(); loadPanel(DRAWER.prop); }
  else if (d.closeDrawer !== undefined){ DRAWER.open = false; renderDrawer(); }
  else if (d.dprop){ DRAWER.prop = d.dprop; renderDrawer(); loadPanel(d.dprop); }
  else if (d.dtype){ DRAWER.type = d.dtype; renderDrawer(); }
  else if (b.hasAttribute("data-refresh")) loadPanel(DRAWER.prop, true);
  else if (d.open){ openDoc(d.open, DRAWER.prop, d.no, d.v ? +d.v : undefined); }
  else if (d.mode){ if (MODE !== d.mode){ MODE = d.mode; S = freshData(S.prop); renderForm(); } }
  else if (d.prop){ if (S.prop !== d.prop){ S.prop = d.prop; S.acc.sel = {}; renderForm(); } }
  else if (d.tax){ S.taxType = d.tax; renderForm(); }
  else if (b.hasAttribute("data-add-addon")){ S.addons.push(blankAddon()); renderForm(); }
  else if (d.delAddon !== undefined){ S.addons.splice(+d.delAddon, 1); renderForm(); }
  else if (b.hasAttribute("data-save-pi")) savePI();
  else if (b.hasAttribute("data-finalise")) finalise();
  else if (b.hasAttribute("data-issue-cn")) issueCN();
  else if (b.hasAttribute("data-dl-current")) downloadCurrent();
  else if (b.hasAttribute("data-upload")) uploadCurrent("");
  else if (b.hasAttribute("data-edit-pi")) editPI();
  else if (b.hasAttribute("data-open-final")) openDoc("INV", VIEW.prop, VIEW.finalNo);
  else if (b.hasAttribute("data-make-cn")){ S = cnFrom(VIEW); MODE = "CN"; VIEW = null; EDITING = null; renderForm(); ensureNext(); }
  else if (b.hasAttribute("data-clear")){ ask("Clear the form?", "Everything you've typed will be removed.", "Clear").then(ok => { if (ok){ S = freshData(S.prop); renderForm(); } }); }
  else if (b.hasAttribute("data-close")){
    const go = () => { const p = (VIEW && VIEW.prop) || S.prop; VIEW = null; EDITING = null; MODE = "PI"; S = freshData(p); renderForm(); ensureNext(); };
    if (EDITING && dirty()) ask("Close without saving?", `Your changes haven't been saved as v${EDITING.v + 1}.`, "Close without saving").then(ok => ok && go());
    else go();
  }
});

async function signIn(){
  const name = (document.getElementById("gName").value || "").trim(), key = (document.getElementById("gKey").value || "").trim();
  if (!name || !key){ say("Enter your name and the access code.", "bad"); return; }
  KEY = key; USER = name; say("Checking…");
  try { await api("ping"); }
  catch(e){ KEY = ""; say(e.message, "bad"); return; }
  store.set("msh_inv_key", key); store.set("msh_inv_user", name);
  render(); ensureNext();
}

render();
if (KEY && USER) ensureNext();

</script>
